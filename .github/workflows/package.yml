name: Package boundaries

on:
  push:
    paths:
      - 'Unity/Assets/**'
      - 'Unity/Packages/**'
      - 'Unity/ProjectSettings/**'
      - '.gitignore'
      - 'tools/**'
      - '.github/workflows/package.yml'
  pull_request:
    paths:
      - 'Unity/Assets/**'
      - 'Unity/Packages/**'
      - 'Unity/ProjectSettings/**'
      - '.gitignore'
      - 'tools/**'
      - '.github/workflows/package.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  boundaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - run: python tools/test_package_layout.py
