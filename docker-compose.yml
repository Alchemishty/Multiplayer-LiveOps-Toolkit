services:
  backend:
    build: ./backend
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - ./backend/.env
    environment:
      DB_PATH: /app/data/db.sqlite3
    volumes:
      - backend-data:/app/data
    command: >
      sh -c "mkdir -p /app/data &&
             python manage.py migrate --noinput &&
             python manage.py seed &&
             gunicorn shop_backend.wsgi:application --bind 0.0.0.0:8000"

volumes:
  backend-data:
