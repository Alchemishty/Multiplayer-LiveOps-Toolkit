version: 1

project:
  name: MultiplayerLiveOpsToolkit
  description: "Unity multiplayer live-ops toolkit with accessory system, shop, wallet, and real-time avatar sync"
  type: existing
  unity_project: "Unity/"

stack:
  language: csharp
  framework: unity
  backend: rest-api
  test_framework: unity-test-framework
  linter: unity-compiler
  packages:
    - "com.unity.netcode.gameobjects@1.9.1"
    - "com.unity.textmeshpro"
    - "Newtonsoft.Json"

commands:
  # These are MCP tool invocations, not shell commands.
  # Use via mcp__UnityMCP__refresh_unity, mcp__UnityMCP__read_console, mcp__UnityMCP__run_tests
  analyze:
    step_1: "mcp: refresh_unity"
    step_2: "mcp: read_console — check for zero errors"
  test: "mcp: run_tests"
  test_editmode: "mcp: run_tests mode=EditMode assembly_names=[EditModeTests, MultiplayerLiveOpsToolkit.Tests.EditMode]"
  test_playmode: "mcp: run_tests mode=PlayMode assembly_names=[PlayModeTests, MultiplayerLiveOpsToolkit.Tests.PlayMode]"
  test_package: "python3 tools/test_package_layout.py"
  test_consumer: "python3 tools/verify_package_consumer.py"
  refresh: "mcp: refresh_unity"

verification:
  method: unity-mcp
  max_retries: 3
  on_fail: fix
  checks:
    - name: compilation
      tool: refresh_unity
      then: read_console
      pass_condition: "zero errors in console output"
    - name: tests
      tool: run_tests
      pass_condition: "all tests pass"

docs:
  root: "docs/"
  architecture: "docs/architecture.md"
  conventions: "docs/conventions.md"
  domain: "docs/domain.md"
  testing: "docs/testing.md"
  memory: "memory/"
  scratch: "scratch/"

enforcement:
  import_direction:
    enabled: true
    layers:
      - Data
      - API
      - Registry
      - Player
      - UI
      - Example
    rule: "lower layers must not reference higher layers"
  custom_rules: "enforcement/"
  coding_rules:
    null_safety: "never-silent"
    principles: "SOLID"
    naming: "fully-descriptive"
    data_structures: "game-design-aware"

gardening:
  enabled: true
  trigger: manual
  skip_directories:
    - "Unity/Library/"
    - "Unity/Temp/"
    - "Unity/Logs/"
    - "Unity/obj/"
    - "TextMesh Pro/"
  skip_extensions:
    - ".meta"
    - ".unity"
    - ".asset"
